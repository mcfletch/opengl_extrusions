[build-system]
# Cython is required to build the package: everything listed here is installed
# for every source build, and ``setup.py`` calls ``cythonize`` to produce the
# accelerated predicates. What is optional is the *result* -- a machine with no
# C compiler still installs, and falls back to the pure-Python predicates at
# import time. Nothing here is optional at runtime; ``dependencies`` below is
# the whole runtime requirement.
requires = ["setuptools>=77", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opengl_extrusions"
# Read from src/opengl_extrusions/__init__.py -- see [tool.setuptools.dynamic]
# below. One definition, because .github/workflows/release.yml decides whether
# to publish by reading `__version__`, and a second copy here that drifted from
# it would mean the version checked against PyPI was not the version built.
dynamic = ["version"]
description = "Tubing, extrusion, lathing and polygon tessellation geometry, as NumPy arrays"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Mike C. Fletcher", email = "mcfletch@vrplumber.com" }
]
keywords = [
    "extrusion", "tubing", "lathe", "tessellation", "triangulation",
    "delaunay", "geometry", "glTF", "numpy", "3D", "CDT",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
test = [
    "pytest",
    # CPython only. Hypothesis is a compiled package now -- it stopped shipping a
    # pure-Python wheel -- and publishes wheels for cp310-cp315 and pp311 alone,
    # so a PyPy row without one tries to build it from source and fails. The
    # property tests ask about geometry rather than about the interpreter, and
    # PyPy is in the matrix for the pure-Python predicates, which do not need it;
    # `tests/test_properties.py` skips where it is absent.
    "hypothesis>=6.0; implementation_name == 'cpython'",
]
# The GLE capture harness (tools/gle_capture.py) only; never imported by the
# package. PyOpenGL 4 is a pre-release, so this extra needs ``pip install --pre``.
gle = ["PyOpenGL>=4.0.0a1", "glfw>=2.0"]
dev = [
    "opengl_extrusions[test]",
    "mypy",
    "ruff",
    "tox>=4.0",
    "Cython>=3.0",
]

[project.urls]
Homepage = "https://github.com/mcfletch/opengl_extrusions"
Repository = "https://github.com/mcfletch/opengl_extrusions"

[tool.setuptools.dynamic]
version = {attr = "opengl_extrusions.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opengl_extrusions = ["py.typed", "*.pyx"]

[tool.pytest.ini_options]
# ``src`` is on testpaths so that the worked examples in the module docstrings
# are run
#
# ``importlib`` import mode is what lets doctest work against a checkout whose
# package is *also* installed non-editably: the default mode refuses to collect
# a file whose module is already imported from somewhere else. tox installs the
# built sdist and runs the doctests against that copy instead -- see tox.ini,
# which overrides ``testpaths`` for exactly that reason.
testpaths = ["tests", "src"]
addopts = "-ra --doctest-modules --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W", "F", "B",
    "ARG",  # unused arguments -- a parameter nothing reads is a lie in a signature
    "I",    # import order
    "UP",   # constructs superseded by the minimum Python
    "SIM",  # simplifications
    "C4",   # comprehensions
    "RUF",
]
ignore = [
    "E501",   # line too long: held by the formatter's line-length, above
    "E741",   # ambiguous variable name
    "RUF005", # concatenation is clearer than unpacking for short literal joins
    # Diagnostics are written with ``%`` formatting throughout, so that the
    # message and the values it interpolates read as two separate things. That
    # is a house style, consistently applied, and `%` is not deprecated.
    "UP031",
    # ``__all__`` is grouped by what each name is for, with a comment per group.
    # Alphabetical order would cost a reader more than it buys them.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
# A test that pins an error signature has to call the thing that raises, and
# `pytest.raises` is the assertion -- so its result is deliberately unused.
"tests/*" = ["ARG001", "ARG002"]

[tool.ruff.format]
# The codebase is single-quoted throughout and the formatter now holds that,
# rather than the previous state where the config named a formatter that was
# never run.
quote-style = "single"
# Prose is wrapped by hand to read at a comfortable width, and the examples in
# it are broken at the places that explain them rather than at the column the
# formatter would choose.
exclude = ["*.md"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
# Without these, mypy skips the bodies of untyped functions entirely
disallow_untyped_defs = true
disallow_incomplete_defs = true
# NumPy's shipped stubs type array arithmetic as ``Any``, so ``warn_return_any``
# fires on nearly every function here that returns an array -- burying the real
# type errors it would otherwise find. Every other check stays on.
warn_return_any = false

# The tox matrix lives in tox.ini, where the `[gh]` table tox-gh reads can sit
# beside it; .github/workflows/test.yml drives it.

[tool.cibuildwheel]
# Stable CPython only, and cibuildwheel >= 3.1 to build them: 3.0.1 and earlier
# do not produce cp314 at all with this configuration, and would have skipped it
# without saying so. The floor is enforced where cibuildwheel is installed, in
# .github/workflows/release.yml.
#
# A wheel per platform means an ordinary `pip install` gets the compiled
# predicates without needing a toolchain. Free-threaded builds (`cp313t`,
# `cp314t`) are not produced: `cp314-*` does not match `cp314t-*`, so adding
# them is a deliberate act rather than something this pattern does by accident.
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_i686 *_i686"
build-frontend = "build"
# `setup.py` deliberately treats a failed accelerator build as a warning rather
# than an error, which is right for a source install on an unknown machine and
# wrong for a wheel we publish: it would ship as a silently slower package. So
# the wheel is required to carry the extension.
test-command = 'python -c "from opengl_extrusions import predicates; assert predicates.ACCELERATED; print(\"predicates: compiled\")"'

# uv decides whether its cached metadata for a source tree is still current
# from pyproject.toml, setup.py and setup.cfg alone. This project's version
# lives in src/opengl_extrusions/__init__.py, so name that file too: without it
# a version bump leaves uv answering with the previous number, and a dependent
# requiring the new one resolves against PyPI rather than this checkout.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/opengl_extrusions/__init__.py" }]
