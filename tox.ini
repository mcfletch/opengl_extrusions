[tox]
# Both predicate implementations are exercised on every interpreter. The
# compiled filter and the pure-Python one are required to return the same sign
# for the same input, so a run that only ever touches whichever one this
# machine happens to have built checks half of the contract.
envlist =
    lint
    typecheck
    py310-{accel,fallback}
    py311-{accel,fallback}
    py312-{accel,fallback}
    py313-{accel,fallback}
    py314-{accel,fallback}
    pypy3-fallback
skip_missing_interpreters = true

[testenv]
# Build an sdist once and install it into each env, so every interpreter
# compiles its own accelerator (build isolation supplies Cython and NumPy).
package = sdist
extras = test
setenv =
    fallback: OPENGL_EXTRUSIONS_NO_ACCEL = 1
# A `fallback` env that quietly ran the compiled filter would pass while
# testing nothing new, and an `accel` env whose extension failed to build would
# silently become a second copy of `fallback`. Both are asserted rather than
# assumed.
commands_pre =
    accel: python -c "from opengl_extrusions import predicates; assert predicates.ACCELERATED, 'the accelerator did not build'; print('predicates: compiled')"
    fallback: python -c "from opengl_extrusions import predicates; assert not predicates.ACCELERATED, 'the accelerator was not disabled'; print('predicates: pure Python')"
commands =
    pytest {posargs:-q}

# Lint and types are gates rather than good intentions: both were declared in
# the `dev` extra and run nowhere.
[testenv:lint]
skip_install = true
deps = ruff
commands =
    ruff check .
    ruff format --check .

[testenv:typecheck]
deps =
    mypy
    numpy>=1.24
    pytest
commands = mypy src/opengl_extrusions

# tox-gh maps a CI interpreter to the envs it should run (see .github/workflows).
[gh]
python =
    3.10 = py310-accel, py310-fallback
    3.11 = py311-accel, py311-fallback
    3.12 = lint, typecheck, py312-accel, py312-fallback
    3.13 = py313-accel, py313-fallback
    3.14 = py314-accel, py314-fallback
    pypy-3.10 = pypy3-fallback
